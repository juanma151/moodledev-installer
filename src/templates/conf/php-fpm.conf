[global]
daemonize = yes
pid       = "@BASE-DIR@/run/php-fpm.pid"
error_log = "@BASE-DIR@/logs/php-fpm.log"


[www]
listen = 127.0.0.1:9000
listen.allowed_clients = 127.0.0.1

user = nobody
group = nogroup

env[MOODLE_CONFIG] = "@BASE-DIR@/conf/moodle-conf.php"

pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

catch_workers_output = yes


